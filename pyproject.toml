[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-nlp-insights"
version = "0.1.0"
description = "Arabic sentiment classification with transparent baselines and optional AraBERT fine-tuning"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.25",
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
transformer = [
  "accelerate>=0.34",
  "datasets>=3.0",
  "torch>=2.3",
  "transformers>=4.45",
]
app = ["streamlit>=1.38"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
